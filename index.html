<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kahwa Queue – Combien d’attente ? | كم الانتظار؟</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1b2a3a;--mut:#6b7684;--line:#e4dccb;--blue:#1d4e89;--g:#2f9e6e;--o:#e9962b;--r:#c8372d;--grey:#9aa3ad}
@media (prefers-color-scheme:dark){:root{--bg:#121a24;--card:#1a2431;--ink:#eef1f5;--mut:#9aa6b4;--line:#2a3646;--blue:#6aa6ec;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Noto Naskh Arabic",Tahoma,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
h1{margin:0;font-size:22px}h1 span{color:var(--r)}
.sub{color:var(--mut);font-size:13px;margin:2px 0 0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}
.btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.mode{font-size:12px;padding:6px 10px;border-radius:10px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.mode b{color:var(--ink)}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
#map{height:440px;border-radius:18px;border:1px solid var(--line);z-index:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:12px;padding:4px 10px}
.list{display:flex;flex-direction:column;gap:8px;max-height:440px;overflow:auto}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:start;width:100%;color:inherit;font:inherit}
.row.sel{border-color:var(--blue)}
.row .t{flex:1;min-width:0}.row b{display:block;font-size:14px}.row small{color:var(--mut)}
.badge{font-weight:700;font-size:13px;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.sheet h2{margin:0 0 2px;font-size:19px}
.verdict{font-size:18px;font-weight:700;margin:8px 0}
.bars,.hrs{direction:ltr}
.bars{display:flex;align-items:flex-end;gap:5px;height:80px;margin:6px 0 2px}
.bars div{flex:1;border-radius:4px 4px 0 0;min-height:4px}
.hrs{display:flex;gap:5px;font-size:10px;color:var(--mut)}.hrs span{flex:1;text-align:center}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:16px 0 6px}
.rep{display:flex;flex-wrap:wrap;gap:6px}
.rep button{flex:1 1 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 8px;font:inherit;font-weight:600;cursor:pointer;min-width:70px}
.rep button:hover{border-color:var(--blue)}.rep .bad{color:var(--r)}
ul.ck{margin:0;padding-inline-start:20px}ul.ck li{margin:3px 0}
.note{font-size:12px;color:var(--mut)}
.log div{font-size:13px;color:var(--mut);padding:2px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9999}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1>Kahwa <span>Queue</span></h1><p class="sub" id="sub"></p></div>
 <div><button class="btn" id="lf">FR</button> <button class="btn" id="la">عربي</button></div>
</header>
<div class="mode" id="mode"></div>
<div class="grid">
 <div><div id="map"></div><div class="legend" id="legend"></div></div>
 <div><div class="chips" id="chips"></div><div class="list" id="list"></div></div>
</div>
<div class="sheet" id="sheet" style="display:none"></div>
<p class="note" id="foot" style="margin-top:12px"></p>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== CONFIG: paste your Supabase values to go live (see supabase-setup.sql). Leave empty for demo mode. ===== */
var CFG={URL:"",KEY:""};
var LIVE=!!(CFG.URL&&CFG.KEY);
var POLL_MS=15000;

var T={fr:{
sub:"Waze de la bureaucratie · Grand Tunis",all:"Tous",post:"Poste",baladiya:"Baladiya",cnam:"CNAM",steg:"STEG / SONEDE",cin:"CIN",pharm:"Pharmacie de garde",
free:"Pas d’attente",down:"Système en panne",noinfo:"Aucune info",min:"min",h2:"2 h+",
go:"Allez-y maintenant",wait:"Attendez un peu",avoid:"Évitez en ce moment",unk:"Pas de rapport récent. Soyez le premier !",
based:"d’après {n} rapport(s) des 90 dernières min",best:"Meilleurs horaires (affluence)",bestdemo:"Meilleurs horaires (exemple, pas encore de vraies données)",
report:"Signaler en 10 secondes",r0:"Aucune",r15:"15 min",r30:"30 min",r60:"1 h",r120:"2 h+",rd:"Système en panne",rc:"Fermé / pas d’agent",
docs:"Documents à apporter (indicatif)",recent:"Derniers rapports",ago:"il y a {n} min",thanks:"Merci ! Rapport ajouté.",
limit:"Déjà signalé il y a peu. Réessayez dans 10 min.",neterr:"Connexion impossible. Réessayez.",closed:"Fermé / pas d’agent",
demo:"<b>Mode démo</b> : données fictives, rapports visibles seulement sur votre appareil.",live:"<b>En direct</b> : les rapports sont partagés et la carte se met à jour toute seule.",
foot:"Les rapports expirent après 90 min. Positions approximatives : vérifiez toujours les horaires et documents auprès de l’administration."},
ar:{
sub:"واز للإدارة · تونس الكبرى",all:"الكل",post:"البريد",baladiya:"البلدية",cnam:"الكنام",steg:"الستاغ / الصوناد",cin:"بطاقة التعريف",pharm:"صيدلية الحراسة",
free:"لا انتظار",down:"النظام معطّل",noinfo:"لا معلومات",min:"د",h2:"+2 س",
go:"روّح توّا",wait:"استنّى شوية",avoid:"ما تمشيش توّا",unk:"ما فمّا حتى تقرير. كن الأول!",
based:"حسب {n} تقرير في آخر 90 دقيقة",best:"أفضل الأوقات (الازدحام)",bestdemo:"أفضل الأوقات (مثال، لا توجد بيانات حقيقية بعد)",
report:"بلّغ في 10 ثواني",r0:"لا شيء",r15:"15 د",r30:"30 د",r60:"ساعة",r120:"+2 س",rd:"النظام معطّل",rc:"مغلق / لا موظف",
docs:"الوثائق المطلوبة (إرشادي)",recent:"آخر التقارير",ago:"منذ {n} د",thanks:"شكرًا! تمّ إضافة التقرير.",
limit:"بلّغت قبل شوية. جرّب بعد 10 دقائق.",neterr:"تعذّر الاتصال. أعد المحاولة.",closed:"مغلق / لا موظف",
demo:"<b>وضع تجريبي</b>: بيانات وهمية والتقارير تظهر على جهازك فقط.",live:"<b>مباشر</b>: التقارير مشتركة والخريطة تتحدّث وحدها.",
foot:"تنتهي التقارير بعد 90 دقيقة. المواقع تقريبية: تأكّد دائمًا من الأوقات والوثائق لدى الإدارة."}};

var DOCS={cin:{fr:["Ancienne carte (ou déclaration de perte)","Extrait de naissance récent","Justificatif de domicile","2 photos d’identité","Timbre fiscal"],ar:["البطاقة القديمة (أو تصريح ضياع)","مضمون ولادة حديث","شهادة إقامة","صورتان شمسيتان","طابع جبائي"]},
baladiya:{fr:["Pièce d’identité + copie","Extrait de naissance","Formulaire de la demande","Timbre fiscal si légalisation"],ar:["بطاقة تعريف + نسخة","مضمون ولادة","استمارة الطلب","طابع جبائي للتعريف بالإمضاء"]},
post:{fr:["Pièce d’identité","Numéro de compte / mandat","Espèces pour les frais éventuels"],ar:["بطاقة التعريف","رقم الحساب / الحوالة","مبلغ نقدي للمعاليم"]},
cnam:{fr:["Carnet de soins","CIN","Dossier de remboursement + factures"],ar:["دفتر العلاج","بطاقة التعريف","ملف التعويض + الفواتير"]},
steg:{fr:["Dernière facture","CIN du titulaire","Contrat d’abonnement (si changement)"],ar:["آخر فاتورة","بطاقة تعريف المشترك","عقد الاشتراك (عند التغيير)"]}};

/* Coordinates are approximate: verify/adjust before launch. */
var P=[
{id:1,c:"post",la:36.7995,ln:10.1800,fr:"La Poste – Tunis Centre",ar:"البريد – تونس المدينة",s:3},
{id:2,c:"baladiya",la:36.7985,ln:10.1700,fr:"Municipalité de Tunis (Kasbah)",ar:"بلدية تونس (القصبة)",s:7},
{id:3,c:"cnam",la:36.8100,ln:10.1650,fr:"CNAM – Bab Saadoun",ar:"الكنام – باب سعدون",s:5},
{id:4,c:"steg",la:36.8010,ln:10.1830,fr:"STEG – Agence Centre-ville",ar:"الستاغ – وكالة وسط المدينة",s:2},
{id:5,c:"steg",la:36.8080,ln:10.1790,fr:"SONEDE – Agence Belvédère",ar:"الصوناد – وكالة البلفدير",s:9},
{id:6,c:"post",la:36.8090,ln:10.1410,fr:"La Poste – Le Bardo",ar:"البريد – باردو",s:4},
{id:7,c:"baladiya",la:36.8625,ln:10.1955,fr:"Municipalité de l’Ariana",ar:"بلدية أريانة",s:6},
{id:8,c:"post",la:36.8350,ln:10.2330,fr:"La Poste – Les Berges du Lac",ar:"البريد – ضفاف البحيرة",s:8},
{id:9,c:"baladiya",la:36.8782,ln:10.3247,fr:"Municipalité de La Marsa",ar:"بلدية المرسى",s:1},
{id:10,c:"post",la:36.7531,ln:10.2189,fr:"La Poste – Ben Arous",ar:"البريد – بن عروس",s:10},
{id:11,c:"cin",la:36.8040,ln:10.1760,fr:"Bureau CIN – Tunis",ar:"مركز بطاقة التعريف – تونس",s:11},
{id:12,c:"cnam",la:36.8590,ln:10.1900,fr:"CNAM – Ariana",ar:"الكنام – أريانة",s:12},
{id:13,c:"pharm",la:36.8200,ln:10.1800,fr:"Pharmacie de garde – Lafayette",ar:"صيدلية حراسة – لافيات",s:13},
{id:14,c:"cin",la:36.7700,ln:10.2330,fr:"Bureau CIN – Mégrine",ar:"مركز بطاقة التعريف – مقرين",s:14}];

var lang="fr",cat="all",sel=null,R=[],MK={},lastSeen=null,last={},busy=false;
try{lang=localStorage.getItem("kq_lang")||((navigator.language||"").slice(0,2)==="ar"?"ar":"fr")}catch(e){}
try{last=JSON.parse(localStorage.getItem("kq_last")||"{}")}catch(e){last={}}
var DEV="d"+Math.random().toString(36).slice(2,12);
try{DEV=localStorage.getItem("kq_dev")||DEV;localStorage.setItem("kq_dev",DEV)}catch(e){}

function $(i){return document.getElementById(i)}
function t(k){return T[lang][k]||k}
function now(){return Date.now()}
function rnd(s){var x=Math.sin(s*9301+49297)*233280;return x-Math.floor(x)}
function fromDB(w){return w==="down"?"d":w==="closed"?"c":Number(w)}
function toDB(w){return w==="d"?"down":w==="c"?"closed":String(w)}

/* ---------- data ---------- */
function seed(){var n=now(),m=60000;
[[1,60,38],[1,30,12],[2,120,70],[2,60,25],[3,30,50],[4,0,8],[5,15,20],[6,30,15],[7,0,30],[8,15,18],[9,0,6],[10,120,40],[10,60,12],[11,120,55],[11,120,20],[12,"d",25],[14,30,35],[3,60,10],[13,"c",15]]
.forEach(function(a){R.push({p:a[0],w:a[1],t:n-a[2]*m})})}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({apikey:CFG.KEY,Authorization:"Bearer "+CFG.KEY},opt.headers||{});return fetch(CFG.URL+"/rest/v1/"+path,opt)}
function pull(){
 if(!LIVE)return Promise.resolve();
 var since=lastSeen||new Date(now()-14*864e5).toISOString();
 return api("reports?select=place_id,wait,created_at&order=created_at.asc&limit=5000&created_at=gt."+encodeURIComponent(since))
 .then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json()})
 .then(function(rows){rows.forEach(function(x){R.push({p:x.place_id,w:fromDB(x.wait),t:new Date(x.created_at).getTime()});lastSeen=x.created_at});if(rows.length)render()})
 .catch(function(){})}
function live(p){var n=now();return R.filter(function(r){return r.p===p&&n-r.t<5400000})}
function stat(p){var L=live(p);if(!L.length)return{k:"noinfo",col:"var(--grey)",hex:"#9aa3ad",n:0};
var down=L.filter(function(r){return r.w==="d"||r.w==="c"}).sort(function(a,b){return b.t-a.t})[0];
var nums=L.filter(function(r){return typeof r.w==="number"}).sort(function(a,b){return b.t-a.t});
if(down&&(!nums.length||down.t>nums[0].t))return{k:"down",col:"var(--r)",hex:"#c8372d",n:L.length,d:down.w};
var sw=0,s=0;nums.forEach(function(r){var w=Math.max(.05,1-(now()-r.t)/5400000);s+=r.w*w;sw+=w});var av=Math.round(s/sw);
return{k:av<=10?"free":"est",min:av,col:av<=15?"var(--g)":av<=45?"var(--o)":"var(--r)",hex:av<=15?"#2f9e6e":av<=45?"#e9962b":"#c8372d",n:L.length}}
function lab(s){if(s.k==="noinfo")return t("noinfo");if(s.k==="down")return s.d==="c"?t("closed"):t("down");if(s.k==="free")return t("free");return s.min>=100?t("h2"):s.min+" "+t("min")}
function curve(p){
 var a=[],has=0;
 for(var h=8;h<=16;h++){
  var v=R.filter(function(r){return r.p===p.id&&LIVE&&new Date(r.t).getHours()===h});
  if(v.length>=3){has++;var avg=v.reduce(function(s,r){return s+(typeof r.w==="number"?r.w:120)},0)/v.length;a.push(Math.min(avg/90,1))}else a.push(null)}
 if(has>=4)return{v:a,real:true};
 var f=[];for(var h2=8;h2<=16;h2++){var b=h2<10?.75:h2<12?.55:h2<14?.3:.5;var x=b+rnd(p.s*7+h2)*.35;if(h2===12)x+=.1;f.push(Math.min(x,1))}
 return{v:f,real:false}}

/* ---------- map ---------- */
var map=L.map("map",{zoomControl:true}).setView([36.82,10.20],11);
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:19,attribution:"&copy; OpenStreetMap contributors &copy; CARTO"}).addTo(map);
var grp=L.layerGroup().addTo(map);
P.forEach(function(p){
 var m=L.circleMarker([p.la,p.ln],{radius:11,weight:3,color:"#fff",fillOpacity:1,fillColor:"#9aa3ad"});
 m.on("click",function(){choose(p.id,true)});MK[p.id]=m});

/* ---------- ui ---------- */
function visible(){return P.filter(function(p){return cat==="all"||p.c===cat})}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("lf").className="btn"+(lang==="fr"?" on":"");$("la").className="btn"+(lang==="ar"?" on":"");
 $("sub").textContent=t("sub");$("foot").textContent=t("foot");$("mode").innerHTML=LIVE?t("live"):t("demo");
 $("legend").innerHTML='<span><i class="dot" style="background:var(--g)"></i>≤15 '+t("min")+'</span><span><i class="dot" style="background:var(--o)"></i>~30–45 '+t("min")+'</span><span><i class="dot" style="background:var(--r)"></i>1 h+ / '+t("down")+'</span><span><i class="dot" style="background:var(--grey)"></i>'+t("noinfo")+'</span>';
 $("chips").innerHTML=["all","post","baladiya","cnam","steg","cin","pharm"].map(function(c){return '<button class="btn chip'+(c===cat?" on":"")+'" data-c="'+c+'">'+t(c)+"</button>"}).join("");
 var V=visible();grp.clearLayers();
 V.forEach(function(p){var s=stat(p.id);MK[p.id].setStyle({fillColor:s.hex,color:sel===p.id?"#1d4e89":"#fff",radius:sel===p.id?14:11});grp.addLayer(MK[p.id])});
 $("list").innerHTML=V.map(function(p){var s=stat(p.id);return '<button class="row'+(sel===p.id?" sel":"")+'" data-p="'+p.id+'"><div class="t"><b>'+p[lang]+"</b><small>"+t(p.c)+(s.n?" · "+s.n:"")+'</small></div><span class="badge" style="background:'+s.col+'">'+lab(s)+"</span></button>"}).join("");
 sheet()}
function choose(id,fromMap){sel=id;render();var p=P.filter(function(x){return x.id===id})[0];map.flyTo([p.la,p.ln],Math.max(map.getZoom(),13),{duration:.6});
 $("sheet").scrollIntoView({behavior:"smooth",block:"nearest"})}
function sheet(){
 var p=P.filter(function(x){return x.id===sel})[0],el=$("sheet");
 if(!p){el.style.display="none";return}el.style.display="block";
 var s=stat(p.id),vt;
 if(s.k==="noinfo")vt=t("unk");else if(s.k==="down")vt=t("avoid");else if(s.min<=15)vt=t("go");else if(s.min<=45)vt=t("wait");else vt=t("avoid");
 var cv=curve(p),hh=new Date().getHours();
 var bars=cv.v.map(function(v,i){var h=8+i;if(v===null)return '<div style="height:6%;background:var(--line)"></div>';var c=v<.4?"var(--g)":v<.7?"var(--o)":"var(--r)";return '<div style="height:'+Math.round(v*100)+"%;background:"+c+";opacity:"+(h===hh?1:.7)+";"+(h===hh?"outline:2px solid var(--blue)":"")+'"></div>'}).join("");
 var hrs=cv.v.map(function(v,i){return "<span>"+(8+i)+"h</span>"}).join("");
 var d=DOCS[p.c],docs=d?"<h3>"+t("docs")+'</h3><ul class="ck">'+d[lang].map(function(x){return "<li>"+x+"</li>"}).join("")+"</ul>":"";
 var Lg=live(p.id).sort(function(a,b){return b.t-a.t}).slice(0,4);
 var log=Lg.map(function(r){var w=r.w==="d"?t("down"):r.w==="c"?t("closed"):r.w===0?t("free"):(r.w>=120?t("h2"):r.w+" "+t("min"));return "<div>"+w+" · "+t("ago").replace("{n}",Math.max(1,Math.round((now()-r.t)/60000)))+"</div>"}).join("");
 var q=[[0,"r0"],[15,"r15"],[30,"r30"],[60,"r60"],[120,"r120"]].map(function(a){return '<button data-w="'+a[0]+'">'+t(a[1])+"</button>"}).join("")+'<button class="bad" data-w="d">'+t("rd")+'</button><button class="bad" data-w="c">'+t("rc")+"</button>";
 el.innerHTML="<h2>"+p[lang]+'</h2><div class="note">'+t(p.c)+'</div><div class="verdict" style="color:'+s.col+'">'+vt+(s.k==="est"||s.k==="free"?" · "+lab(s):"")+"</div>"+(s.n?'<div class="note">'+t("based").replace("{n}",s.n)+"</div>":"")+
 "<h3>"+(cv.real?t("best"):t("bestdemo"))+'</h3><div class="bars">'+bars+'</div><div class="hrs">'+hrs+"</div>"+
 "<h3>"+t("report")+'</h3><div class="rep">'+q+"</div>"+(log?"<h3>"+t("recent")+'</h3><div class="log">'+log+"</div>":"")+docs}
function toast(m){var e=$("toast");e.textContent=m;e.className="toast show";setTimeout(function(){e.className="toast"},2400)}
function saveLast(){try{localStorage.setItem("kq_last",JSON.stringify(last))}catch(e){}}

function send(w){
 if(busy)return;
 if(last[sel]&&now()-last[sel]<600000){toast(t("limit"));return}
 if(!LIVE){R.push({p:sel,w:w,t:now()});last[sel]=now();saveLast();render();toast(t("thanks"));return}
 busy=true;
 api("reports",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({place_id:sel,wait:toDB(w),device:DEV})})
 .then(function(r){
  if(r.ok){last[sel]=now();saveLast();return pull().then(function(){toast(t("thanks"))})}
  return r.text().then(function(b){toast(b.indexOf("rate_limit")>-1?t("limit"):t("neterr"))})})
 .catch(function(){toast(t("neterr"))})
 .then(function(){busy=false})}

document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.id==="lf"||b.id==="la"){lang=b.id==="lf"?"fr":"ar";try{localStorage.setItem("kq_lang",lang)}catch(x){}render()}
 else if(b.dataset.c){cat=b.dataset.c;if(sel&&!visible().some(function(p){return p.id===sel}))sel=null;render()}
 else if(b.dataset.p){choose(+b.dataset.p)}
 else if(b.dataset.w!==undefined&&sel){var w=b.dataset.w;send(w==="d"||w==="c"?w:Number(w))}});

if(!LIVE)seed();
sel=1;
render();
pull();
setInterval(pull,POLL_MS);
setInterval(render,60000);
